<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; media-src https://simple.amazingtier.top https://ds164.bluetier.top blob:; connect-src 'self' https://simple.amazingtier.top https://ds164.bluetier.top; object-src 'none'; base-uri 'none'">
  <title>TV en direct</title>
  <style>
    *{box-sizing:border-box}html,body,main,video{width:100%;height:100%;margin:0;border:0;background:#000}
    html,body{overflow:hidden}
    video{position:fixed;inset:0;display:block;object-fit:fill}
    #panel{
      position:fixed;
      left:16px;
      right:auto;
      bottom:16px;
      width:fit-content;
      max-width:calc(100% - 32px);
      padding:9px 11px;
      color:#d7dbe0;
      background:#000b;
      border:1px solid #ffffff2a;
      border-radius:8px;
      font:12px/1.35 system-ui,sans-serif;
      z-index:2;
      opacity:.88;
    }
    #panel.hidden{display:none}
    #play{
      margin-top:8px;
      padding:7px 10px;
      border:1px solid #ffffff33;
      border-radius:6px;
      color:#c7cbd1;
      background:#ffffff0d;
      font-size:12px;
      font-weight:600;
      cursor:pointer;
      box-shadow:none;
      transition:color .15s ease, border-color .15s ease, background-color .15s ease;
    }
    #play:hover,
    #play:focus-visible{
      color:#fff;
      border-color:#ffffff88;
      background:#ffffff1a;
      outline:2px solid #ffffff55;
      outline-offset:2px;
    }
  </style>
</head>
<body>
  <main>
    <video id="video" controls autoplay playsinline></video>
    <div id="panel"><strong id="status">Connexion à Vercel…</strong><br><button id="play">Lancer la lecture</button></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <script src="/player.js"></script>
</body>
</html>
